<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Eventi</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .hidden { display: none; }
    .card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    .admin-controls { background: #f0f0f0; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
    form div { margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>Lista Eventi</h1>

  <!-- BARRA ADMIN / LOGIN -->
  <div class="admin-controls">
    <div id="login-section">
      <button onclick="mostraModalLogin()">🔐 Login Admin</button>
    </div>
    <div id="admin-section" class="hidden">
      <span>🟢 Connesso come Admin (<strong id="user-display"></strong>)</span>
      <button onclick="logout()">Logout</button>
      <hr>
      <h3>➕ Aggiungi Nuovo Evento</h3>
      <form id="event-form" onsubmit="gestisciSalvataggio(event)">
        <div>
          <label>Titolo:</label><br>
          <input type="text" id="titolo" required>
        </div>
        <div>
          <label>Data:</label><br>
          <input type="date" id="data" required>
        </div>
        <div>
          <label>Descrizione:</label><br>
          <textarea id="descrizione" required></textarea>
        </div>
        <button type="submit">Salva Evento su GitHub</button>
      </form>
    </div>
  </div>

  <!-- CONTENITORE EVENTI -->
  <div id="eventi-container">Caricamento eventi...</div>

  <!-- MODALE LOGIN -->
  <dialog id="login-modal">
    <form method="dialog" onsubmit="confermaLogin(event)">
      <h3>Accesso Amministratore</h3>
      <div>
        <label>Password Admin:</label><br>
        <input type="password" id="login-pass" required>
      </div>
      <div>
        <label>Nome Utente GitHub:</label><br>
        <input type="text" id="login-user" placeholder="es. mario-rossi" required>
      </div>
      <div>
        <label>Personal Access Token (PAT):</label><br>
        <input type="password" id="login-token" placeholder="ghp_xxxx..." required>
      </div>
      <menu style="text-align: right; padding: 0;">
        <button type="button" onclick="chiudiModalLogin()">Annulla</button>
        <button type="submit">Accedi</button>
      </menu>
    </form>
  </dialog>

  <script>
    // CONFIGURAZIONE REPOSITORY
    const REPO_NAME = "mmeventi";
    const FILE_PATH = "events.json";
    const ADMIN_PASSWORD_CORRETTA = "admin123"; // Imposta la tua password preferita

    // 1. CARICAMENTO INIZIALE EVENTI
    async function caricaEventi() {
      try {
        const res = await fetch(`${FILE_PATH}?v=${Date.now()}`);
        const eventi = await res.json();
        const container = document.getElementById("eventi-container");
        container.innerHTML = "";

        if (eventi.length === 0) {
          container.innerHTML = "<p>Nessun evento presente.</p>";
          return;
        }

        eventi.forEach(e => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `<h3>${e.titolo}</h3><small>${e.data}</small><p>${e.descrizione}</p>`;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById("eventi-container").innerHTML = "<p>Errore nel caricamento del file JSON.</p>";
      }
    }

    // 2. GESTIONE LOGIN / LOGOUT
    function mostraModalLogin() {
      document.getElementById("login-modal").showModal();
    }

    function chiudiModalLogin() {
      document.getElementById("login-modal").close();
    }

    function confermaLogin(e) {
      e.preventDefault();
      const pass = document.getElementById("login-pass").value;
      const user = document.getElementById("login-user").value.trim();
      const token = document.getElementById("login-token").value.trim();

      if (pass !== ADMIN_PASSWORD_CORRETTA) {
        alert("Password errata!");
        return;
      }

      // Salva le credenziali nel browser dell'utente
      localStorage.setItem("gh_user", user);
      localStorage.setItem("gh_token", token);
      
      chiudiModalLogin();
      verificaStatoLogin();
    }

    function logout() {
      localStorage.removeItem("gh_user");
      localStorage.removeItem("gh_token");
      verificaStatoLogin();
    }

    function verificaStatoLogin() {
      const user = localStorage.getItem("gh_user");
      const token = localStorage.getItem("gh_token");

      if (user && token) {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("admin-section").classList.remove("hidden");
        document.getElementById("user-display").innerText = user;
      } else {
        document.getElementById("login-section").classList.remove("hidden");
        document.getElementById("admin-section").classList.add("hidden");
      }
    }

    // 3. SALVATAGGIO EVENTO SU GITHUB API
    async function gestisciSalvataggio(e) {
      e.preventDefault();

      const user = localStorage.getItem("gh_user");
      const token = localStorage.getItem("gh_token");

      if (!user || !token) {
        alert("Sessione scaduta. Effettua nuovamente il login.");
        logout();
        return;
      }

      const nuovoEvento = {
        titolo: document.getElementById("titolo").value,
        data: document.getElementById("data").value,
        descrizione: document.getElementById("descrizione").value
      };

      const apiUrl = `https://api.github.com/repos/${user}/${REPO_NAME}/contents/${FILE_PATH}`;

      try {
        // A. Recupera il file attuale e il suo SHA
        const resGet = await fetch(apiUrl, {
          headers: { Authorization: `token ${token}` }
        });

        if (!resGet.ok) throw new Error("Impossibile recuperare il file da GitHub. Controlla Nome Utente e Token.");
        const fileData = await resGet.json();

        // B. Decodifica i dati esistenti
        const contenutoAttuale = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        // C. Aggiungi il nuovo evento
        contenutoAttuale.push(nuovoEvento);

        // D. Converti l'array aggiornato in Base64
        const nuovoContenutoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(contenutoAttuale, null, 2))));

        // E. Invia l'aggiornamento a GitHub
        const resPut = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            Authorization: `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Aggiunto evento: ${nuovoEvento.titolo}`,
            content: nuovoContenutoBase64,
            sha: fileData.sha
          })
        });

        if (resPut.ok) {
          alert("Evento salvato con successo su GitHub! La pagina si aggiornerà in circa 1 minuto.");
          document.getElementById("event-form").reset();
          setTimeout(caricaEventi, 2000);
        } else {
          alert("Errore durante il salvataggio. Verifica i permessi del Token.");
        }
      } catch (err) {
        alert("Si è verificato un errore: " + err.message);
      }
    }

    // Avvio automatico al caricamento della pagina
    verificaStatoLogin();
    caricaEventi();
  </script>
</body>
</html>
